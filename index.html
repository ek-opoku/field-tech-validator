<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field Tech Validator</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* Keep this page self-contained for simple hosting */
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 14px;
        background:
          radial-gradient(1100px 520px at 20% 0%, rgba(124, 92, 255, 0.30), transparent 60%),
          radial-gradient(900px 520px at 90% 10%, rgba(54, 211, 153, 0.18), transparent 55%),
          linear-gradient(180deg, #0b1220, #070b14);
        color: rgba(255, 255, 255, 0.92);
      }
      .card {
        width: min(860px, 100%);
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        padding: 22px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 1.5rem;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.65);
        line-height: 1.55;
      }
      .cmd {
        margin-top: 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(0, 0, 0, 0.18);
        padding: 14px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        color: rgba(255, 255, 255, 0.88);
      }
      .row {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a.btn {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
        color: rgba(255, 255, 255, 0.92);
        background: linear-gradient(135deg, rgba(124, 92, 255, 1), rgba(54, 211, 153, 0.95));
      }
      a.link {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Field Tech Validator</h1>
        <p>
          This project includes a Streamlit app (<code>app.py</code>) with a mobile-friendly data entry form, plus this
          simple landing page.
        </p>

        <div class="cmd"><code>streamlit run app.py</code></div>

        <div class="row">
          <a class="btn" href="#" onclick="alert('Run: streamlit run app.py'); return false;">Run locally</a>
          <a class="link" href="./app.py">View app.py</a>
          <a class="link" href="./style.css">View style.css</a>
        </div>
      </div>
    </div>
  </body>
</html>
